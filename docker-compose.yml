version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finchat-postgres
    restart: always
    environment:
      POSTGRES_USER: finchat_user
      POSTGRES_PASSWORD: finchat_password
      POSTGRES_DB: finchat_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: finchat-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://finchat_user:finchat_password@postgres:5432/finchat_db
      - SECRET_KEY=super_secret_key_change_me_in_production
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: finchat-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
