services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: finchat-postgres
    restart: always
    environment:
      POSTGRES_USER: finchat_user
      POSTGRES_PASSWORD: finchat_password
      POSTGRES_DB: finchat_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finchat-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finchat-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - UPLOAD_DIR=/app/data/uploads
      - OLLAMA_URL=http://host.docker.internal:11434
      - API_URL=${API_URL:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5500}
    depends_on:
      - postgres
      - redis
    volumes:
      - finchat-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  finchat-data:
  pgdata:
  redisdata:
