<!DOCTYPE html>

<title>FinChat — Redirecting…</title>
<!--
  The old "inbox" chat UI (System Monitor rail, persona search, chain panels)
  has been retired. FinChat now has a single chat surface: finchat_chat.html.
  This page is kept only as a redirect so any old notification link, bookmark,
  or deep link (?session=…) still lands on the current chat instead of 404ing.
  Do not rebuild the old UI here.
-->
<script>
  (function () {
    // Preserve query string (e.g. ?session=briefing_… deep links) and hash.
    var dest = 'finchat_chat.html' + (location.search || '') + (location.hash || '');
    location.replace(dest); // replace() so Back doesn't bounce here again
  })();
</script>
