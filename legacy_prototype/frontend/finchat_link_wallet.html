<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>FinChat - Link Wallet</title>
<!-- Google Fonts -->
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          beige: '#f6f3eb',
          darkBrown: '#3a2b1c',
          textMuted: '#6B7280',
          borderLight: '#e0e0e0',
        },
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          serif: ['Playfair Display', 'serif'],
        }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caprasimo&display=swap" rel="stylesheet">
<link rel="stylesheet" href="finchat_theme.css">
<style>
  body {
    background-color: var(--bg);
    margin: 0;
    overflow-x: hidden;
  }
  .scene-wrapper {
    position: relative;
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    z-index: 10;
  }
  .login-card {
    position: relative;
    z-index: 10;
    background: white;
    border-radius: 24px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    border: 1px solid rgba(0,0,0,0.03);
  }
  .robot-container {
    position: absolute;
    top: 50%;
    right: -70px;
    margin-top: -80px;
    z-index: 0;
    transform: rotate(90deg) translateY(0px) translateX(10px); 
    animation: peek-from-right 12s infinite cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes peek-from-right {
    0%, 15% { transform: rotate(90deg) translateY(120px); }
    20%, 35% { transform: rotate(90deg) translateY(0px) translateX(10px); }
    40%, 65% { transform: rotate(90deg) translateY(12px) translateX(13px); }
    70%, 85% { transform: rotate(90deg) translateY(0px) translateX(7px); }
    90%, 100% { transform: rotate(90deg) translateY(120px); }
  }
  /* robot internal animations */
  .robot-eye { transform-origin: center; animation: blink 4s infinite; }
  .robot-head { transform-origin: center 70px; animation: head-tilt 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes head-tilt {
    0%, 40% { transform: rotate(0deg); }
    45%, 52% { transform: rotate(8deg); }
    57%, 65% { transform: rotate(-6deg); }
    70%, 100% { transform: rotate(0deg); }
  }
  @keyframes blink {
    0%, 96% { transform: scaleY(1); }
    98% { transform: scaleY(0.1); }
    100% { transform: scaleY(1); }
  }
  
  .icon-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px auto;
  }
</style>
</head>
<body class="min-h-screen flex flex-col relative">

  <!-- Header -->
  <header class="w-full flex justify-between items-center p-8 absolute top-0 left-0">
    <h1 class="font-serif text-[26px] leading-none tracking-tight text-[#1a1a1a]">FinChat</h1>
    <div class="flex items-center gap-4">
      <span class="text-[10px] font-bold tracking-widest text-[#8c7a6b]">STEP 2 OF 3</span>
      <div class="flex gap-1">
        <div class="w-8 h-[2px] bg-[#3a2b1c]"></div>
        <div class="w-8 h-[2px] bg-[#3a2b1c]"></div>
        <div class="w-8 h-[2px] bg-[#d6ccbc]"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center">
    <div class="scene-wrapper">
      
      <!-- Animated Robot SVG -->
      <div class="robot-container w-[110px] h-[95px]">
        <svg viewBox="0 0 110 95" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g class="robot-head">
            <path d="M25 80 C 25 65, 85 65, 85 80 L 85 95 L 25 95 Z" fill="#3a2b1c" />
            <circle cx="55" cy="12" r="5" fill="#3a2b1c" />
            <line x1="55" y1="16" x2="55" y2="28" stroke="#3a2b1c" stroke-width="3" />
            <path d="M 23 48 Q 17 48 17 41 Q 17 34 23 34 Z" fill="#3a2b1c" />
            <path d="M 87 48 Q 93 48 93 41 Q 93 34 87 34 Z" fill="#3a2b1c" />
            <rect x="25" y="27" width="60" height="46" rx="22" fill="#3a2b1c" />
            <rect x="35" y="37" width="40" height="26" rx="12" fill="#f6f3eb" />
            <g class="robot-eye" style="transform-origin: 46px 48px;">
              <circle cx="46" cy="48" r="4.5" fill="#3a2b1c" />
            </g>
            <g class="robot-eye" style="transform-origin: 64px 48px;">
              <circle cx="64" cy="48" r="4.5" fill="#3a2b1c" />
            </g>
            <circle cx="22" cy="85" r="10" fill="#3a2b1c" />
            <circle cx="88" cy="85" r="10" fill="#3a2b1c" />
            <path d="M 18 80 Q 22 76 26 80" stroke="#f6f3eb" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
            <path d="M 84 80 Q 88 76 92 80" stroke="#f6f3eb" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
          </g>
        </svg>
      </div>

      <!-- Card -->
      <div class="login-card p-12 text-center">
        <div class="icon-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3a2b1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
          </svg>
        </div>
        <h2 class="font-serif text-[28px] text-[#1a1a1a] mb-4">Link Institutional Wallet</h2>
        <p class="text-[13px] text-gray-500 mb-8 leading-relaxed px-4">
          Connect your Web3 anchor to enable temporal anchoring and tokenomics.
        </p>
        
        <div class="flex flex-col gap-3">
          <button onclick="handleConnectPhantom()" class="w-full bg-darkBrown hover:bg-[#2e2216] transition-colors text-white font-medium text-[14px] py-[14px] rounded-full shadow-sm flex items-center justify-center gap-2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
              <path d="M12 12 2.1 7.1"></path>
              <path d="M12 12l9.9-4.9"></path>
            </svg>
            Connect Phantom
          </button>
          
          <button onclick="handleConnectWeb3()" class="w-full bg-white hover:bg-gray-50 border border-gray-300 transition-colors text-darkBrown font-medium text-[14px] py-[14px] rounded-full shadow-sm flex items-center justify-center gap-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            Connect Web3 Anchor
          </button>
        </div>

        <button onclick="skipForNow()" class="mt-8 text-[12px] text-gray-400 hover:text-gray-600 font-medium transition-colors">
          Skip for now
        </button>
      </div>

    </div>
  </main>

  <script>
    function continueToInbox() {
      // In a real app, we'd update the user's wallet address in the backend via API
      window.location.href = 'finchat_chat.html';
    }

    function handleConnectPhantom() {
      // Simulate connection
      alert("Connecting Phantom wallet...");
      continueToInbox();
    }

    function handleConnectWeb3() {
      // Simulate connection
      continueToInbox();
    }

    function skipForNow() {
      continueToInbox();
    }
  </script>
</body>
</html>
