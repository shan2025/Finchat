<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The share token rides in the URL fragment; this keeps any link clicked
     from here from carrying the page URL along as a Referer. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Shared Mind Map | FinChat</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<!--
  Read-only viewer for a mind map share link (routes/sharedMindMaps.js).

  Standalone on purpose: no login, no sidebar, no spa_router. The person
  opening this may have no FinChat account, and nothing here may assume one.
  Hand-written, not design-tool managed.
-->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Caprasimo&display=swap" rel="stylesheet">
<style>
/* Whiteboard look, the same as the owner's editor and Boards: white panels on a
   dotted canvas, one blue for actions, colour carried by the branches. */
:root, [data-theme="warm"] {
  --bg:#ffffff; --surface:#ffffff; --surface2:#f4f5f8; --canvas:#f5f6f8; --dot:#d9dce3;
  --line:#e3e5ea; --line2:#cfd3da; --fg:#1c1f26; --fg2:#4b5160; --muted:#7c8392;
  --accent:#4262ff; --link:#cfd3da; --xlink:#4262ff; --root:#1c1f26; --root-fg:#ffffff;
  --shadow:0 1px 2px rgba(20,24,36,.06), 0 10px 32px rgba(20,24,36,.12);
}
[data-theme="dark"] {
  --bg:#16181d; --surface:#1f2229; --surface2:#262a33; --canvas:#16181d; --dot:#2a2e37;
  --line:#2f343e; --line2:#3b414d; --fg:#eceef2; --fg2:#c3c8d2; --muted:#8b92a1;
  --accent:#6b83ff; --link:#3b414d; --xlink:#8ea0ff; --root:#eceef2; --root-fg:#16181d;
  --shadow:0 10px 34px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="warm"]) {
    --bg:#16181d; --surface:#1f2229; --surface2:#262a33; --canvas:#16181d; --dot:#2a2e37;
    --line:#2f343e; --line2:#3b414d; --fg:#eceef2; --fg2:#c3c8d2; --muted:#8b92a1;
    --accent:#6b83ff; --link:#3b414d; --xlink:#8ea0ff; --root:#eceef2; --root-fg:#16181d;
    --shadow:0 10px 34px rgba(0,0,0,.5);
  }
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { font-family:'Figtree',system-ui,sans-serif; background:var(--bg); color:var(--fg);
  overflow:hidden; display:flex; flex-direction:column; }
.serif { font-family:'Figtree',system-ui,sans-serif; font-weight:800; letter-spacing:-.01em; }
.material-symbols-outlined { font-size:18px; vertical-align:middle; }

.bar { display:flex; align-items:center; gap:10px; padding:12px 18px;
  border-bottom:1px solid var(--line); background:var(--surface); flex-wrap:wrap; }
.bar h1 { margin:0; font-size:20px; flex:1; min-width:0; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.pill { font-size:11.5px; font-weight:700; color:var(--muted); background:var(--surface2);
  border:1px solid var(--line); border-radius:99px; padding:3px 10px; white-space:nowrap; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:7px 12px;
  border:1px solid var(--line2); border-radius:10px; background:var(--surface);
  color:var(--fg2); font:700 12.5px 'Figtree',sans-serif; cursor:pointer; text-decoration:none; }
.btn[hidden] { display:none; }
.btn:hover { color:var(--accent); border-color:var(--accent); }
.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.primary:hover { filter:brightness(1.07); color:#fff; }

#stage { position:relative; flex:1; min-height:0; overflow:hidden; background-color:var(--canvas);
  background-image:radial-gradient(var(--dot) 1.1px, transparent 1.2px); background-size:22px 22px;
  cursor:grab; touch-action:none; }
#stage.dragging { cursor:grabbing; }
#world { position:absolute; left:0; top:0; transform-origin:0 0; }
#links { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
#links path { fill:none; stroke:var(--link); stroke-width:2.4; stroke-linecap:round; }
#links path.x { stroke:var(--xlink); stroke-dasharray:6 5; stroke-width:1.6; }

.node { position:absolute; width:230px; min-height:60px; padding:9px 12px 9px 14px;
  background:var(--surface); border:1.5px solid var(--line2); border-radius:12px;
  box-shadow:0 1px 2px rgba(20,24,36,.06); cursor:pointer; user-select:none; }
.node:hover { box-shadow:0 4px 14px rgba(20,24,36,.14); }
.node.sel { outline:3px solid var(--accent); outline-offset:2px; }
.node.root { background:var(--root); color:var(--root-fg); border-color:var(--root); }
.node.root .sum { color:var(--root-fg); opacity:.8; }
/* A branch node is filled with its branch colour (set inline); its text is
   light or dark to suit that colour. */
.node.filled .sum { color:inherit; opacity:.85; }
.node.filled .badge { color:inherit; }
.node .stripe { position:absolute; left:0; top:10px; bottom:10px; width:4px; border-radius:0 3px 3px 0; }
.node .lab { font-weight:800; font-size:13.5px; line-height:1.3; }
.node .sum { font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.node .badges { display:flex; gap:6px; margin-top:5px; }
.node .badge { font-size:10.5px; font-weight:700; color:var(--accent); display:inline-flex; align-items:center; gap:2px; }
.node.root .badge { color:inherit; }
.node .badge .material-symbols-outlined { font-size:14px; }
.node .tog { position:absolute; right:-12px; top:50%; transform:translateY(-50%);
  width:22px; height:22px; border-radius:50%; border:1px solid var(--line2);
  background:var(--surface); color:var(--fg2); font:800 12px 'Figtree',sans-serif;
  display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }

#panel { position:absolute; right:14px; top:14px; bottom:14px; width:min(390px, calc(100% - 28px));
  background:var(--surface); border:1px solid var(--line2); border-radius:18px;
  box-shadow:var(--shadow); display:none; flex-direction:column; overflow:hidden; cursor:auto; }
#panel.open { display:flex; }
.p-head { padding:14px 16px 10px; border-bottom:1px solid var(--line); }
.p-path { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; }
.p-title { font-size:19px; margin-top:4px; }
.p-body { padding:14px 16px 18px; overflow-y:auto; flex:1; font-size:13.5px; line-height:1.65; color:var(--fg2); }
.p-body h3 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:16px 0 6px; }
.icon-btn { border:none; background:none; color:var(--muted); cursor:pointer; padding:2px; border-radius:6px; }
.icon-btn:hover { color:var(--accent); }
.doc { border:1px solid var(--line); background:var(--surface2); border-radius:12px; padding:9px 11px; margin-bottom:8px; }
.doc .n { font-weight:700; color:var(--fg); font-size:13px; word-break:break-word; }
.doc .m { font-size:11px; color:var(--muted); margin-top:1px; }
.doc .a { display:flex; gap:6px; margin-top:7px; flex-wrap:wrap; }
.doc .a .btn { padding:5px 9px; font-size:11.5px; }
.doctext { white-space:pre-wrap; word-break:break-word; font-size:12.5px; line-height:1.6;
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; color:var(--fg2);
  margin-top:9px; max-height:50vh; overflow-y:auto; overscroll-behavior:contain; }
img.preview { display:block; max-width:100%; margin-top:9px; border-radius:10px; border:1px solid var(--line); }
/* The stage takes touches for panning; the panel scrolls on its own. */
#panel { touch-action:pan-y; }

.zoom { position:absolute; left:14px; bottom:14px; display:flex; flex-direction:column; gap:6px; }
.zoom .btn { padding:6px 8px; }
#msg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:10px; text-align:center; padding:30px; color:var(--muted); }
#msg .serif { font-size:22px; color:var(--fg); }
.foot { font-size:11px; color:var(--muted); padding:6px 18px; border-top:1px solid var(--line); background:var(--surface); }

@media (max-width:640px) {
  .bar { padding:10px 16px; }
  .bar h1 { font-size:17px; flex-basis:100%; }
  #panel { left:0; right:0; top:auto; bottom:0; width:100%; height:62%; border-radius:18px 18px 0 0; }
}
</style>
</head>
<body>
<header class="bar">
  <h1 class="serif" id="title">Shared mind map</h1>
  <span class="pill" id="meta"></span>
  <a class="btn" id="dl" hidden title="Download the map with its documents — open map.canvas in Obsidian, or import the .zip into FinChat">
    <span class="material-symbols-outlined">folder_zip</span> Download</a>
  <button class="btn" id="themeBtn" title="Theme"><span class="material-symbols-outlined">dark_mode</span></button>
</header>

<div id="stage">
  <svg id="links"></svg>
  <div id="world"></div>
  <div id="msg"><div class="serif">Loading…</div></div>
  <div class="zoom">
    <button class="btn" id="zin" title="Zoom in"><span class="material-symbols-outlined">add</span></button>
    <button class="btn" id="zout" title="Zoom out"><span class="material-symbols-outlined">remove</span></button>
    <button class="btn" id="zfit" title="Fit (F)"><span class="material-symbols-outlined">fit_screen</span></button>
  </div>
  <aside id="panel">
    <div class="p-head">
      <div class="p-path"><span id="pPath"></span>
        <button class="icon-btn" id="pClose" title="Close (Esc)"><span class="material-symbols-outlined">close</span></button></div>
      <div class="p-title serif" id="pTitle"></div>
    </div>
    <div class="p-body" id="pBody"></div>
  </aside>
</div>
<div class="foot">View only · shared from FinChat</div>

<script>
(() => {
  const TOKEN = location.hash.slice(1);
  const API = `/api/shared/mind-maps/${encodeURIComponent(TOKEN)}`;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const fmtSize = b => !b ? '' : b < 1024 ? b + ' B'
    : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

  // ── theme ──
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    $('themeBtn').firstElementChild.textContent = dark ? 'light_mode' : 'dark_mode';
  }
  let theme = null;
  try { theme = localStorage.getItem('finchat_mm_share_theme'); } catch (e) {}
  applyTheme(theme);
  $('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'warm');
    const next = cur === 'dark' ? 'warm' : 'dark';
    try { localStorage.setItem('finchat_mm_share_theme', next); } catch (e) {}
    applyTheme(next);
    // Deeper nodes are tinted against the surface colour, which just changed.
    if (ROOT) render();
  });

  function toast(msg) {
    let t = $('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;' +
        'background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font:700 13px Figtree,sans-serif;' +
        'box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;transition:opacity .2s;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._h);
    t._h = setTimeout(() => { t.style.opacity = '0'; }, 3200);
  }

  /**
   * Download by fetching first, then saving the bytes. A plain link to an
   * attachment fails silently — a revoked link, an expired one, a server
   * error all look like "the button does nothing". Fetching lets the reader be
   * told why.
   */
  async function saveFrom(url, fallbackName, btn) {
    const old = btn ? btn.innerHTML : '';
    if (btn) { btn.style.pointerEvents = 'none'; btn.style.opacity = '.6'; }
    try {
      const r = await fetch(url);
      if (!r.ok) {
        const b = await r.json().catch(() => ({}));
        throw new Error(b.error || `the server answered ${r.status}`);
      }
      const cd = r.headers.get('content-disposition') || '';
      const star = /filename\*=UTF-8''([^;]+)/i.exec(cd);
      const plain = /filename="([^"]+)"/i.exec(cd);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(await r.blob());
      a.download = star ? decodeURIComponent(star[1]) : (plain ? plain[1] : fallbackName);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast(`Downloading ${a.download}`);
    } catch (e) {
      toast('Download failed: ' + e.message);
    } finally {
      if (btn) { btn.style.pointerEvents = ''; btn.style.opacity = ''; btn.innerHTML = old; }
    }
  }

  $('dl').addEventListener('click', (e) => {
    e.preventDefault();
    saveFrom($('dl').href, 'mind-map.zip', $('dl'));
  });

  function fail(title, body) {
    $('msg').style.display = 'flex';
    $('msg').innerHTML = `<span class="material-symbols-outlined" style="font-size:46px; opacity:.4;">link_off</span>
      <div class="serif">${esc(title)}</div><div style="max-width:380px; font-size:13.5px; line-height:1.6;">${esc(body)}</div>`;
  }

  // ── data ──
  let DATA = null;
  const NODES = new Map();
  let ROOT = null;
  const DOCS = new Map();       // nodeId|'' -> docs
  let SELECTED = null;

  async function load() {
    if (!/^[A-Za-z0-9_-]{43}$/.test(TOKEN)) {
      fail('This link is incomplete', 'The address is missing its key. Ask whoever shared it to copy the link again.');
      return;
    }
    let res;
    try { res = await fetch(API); } catch (e) { fail('Could not reach FinChat', 'Check your connection and reload.'); return; }
    if (!res.ok) {
      const b = await res.json().catch(() => ({}));
      fail('This link is not available', b.error || 'It may have been revoked or expired.');
      return;
    }
    DATA = await res.json();
    document.title = `${DATA.map.title || 'Mind map'} | FinChat`;
    $('title').textContent = DATA.map.title || 'Mind map';
    const nd = DATA.docs.length;
    $('meta').textContent = `${DATA.nodes.length} nodes` + (DATA.includeDocs ? ` · ${nd} document${nd === 1 ? '' : 's'}` : '');
    $('dl').href = `${API}/bundle`;
    $('dl').hidden = false;

    for (const n of DATA.nodes) NODES.set(n.nodeId, { ...n, children: [] });
    for (const n of NODES.values()) {
      if (n.parentId && NODES.has(n.parentId)) NODES.get(n.parentId).children.push(n);
      else if (!n.parentId) ROOT = n;
    }
    for (const n of NODES.values()) n.children.sort((a, b) => a.order - b.order);
    for (const d of DATA.docs) {
      const k = d.nodeId || '';
      if (!DOCS.has(k)) DOCS.set(k, []);
      DOCS.get(k).push(d);
    }
    if (!ROOT) { fail('This map is empty', 'There is nothing on it yet.'); return; }
    $('msg').style.display = 'none';
    render();
    // On a phone the panel is a bottom sheet over most of the map, so the map
    // comes first there and the overview opens on a tap.
    if (innerWidth > 640) select(ROOT.nodeId);
    fit();
  }

  // ── layout: depth is the column, each visible leaf its own row ──
  const W = 230, COL = 300, ROW = 16;
  const HEIGHT = new Map();

  function visible(n, out = []) {
    out.push(n);
    if (!n.collapsed) n.children.forEach(c => visible(c, out));
    return out;
  }

  function layout() {
    let cursor = 0;
    const place = (n, depth) => {
      n.x = depth * COL;
      const h = HEIGHT.get(n.nodeId) || 64;
      const kids = n.collapsed ? [] : n.children;
      if (!kids.length) { n.y = cursor; cursor += h + ROW; return n.y + h / 2; }
      const mids = kids.map(k => place(k, depth + 1));
      const mid = (mids[0] + mids[mids.length - 1]) / 2;
      n.y = mid - h / 2;
      if (n.y + h + ROW > cursor) cursor = n.y + h + ROW;
      return mid;
    };
    place(ROOT, 0);
  }

  function docCount(id) { return (DOCS.get(id) || []).length + (id === ROOT.nodeId ? (DOCS.get('') || []).length : 0); }

  // ── branch colours (same palette and rules as the editor) ──
  const BRANCH_COLORS = ['#6631d7', '#2b59c3', '#12a150', '#fb8c00', '#e84fa7',
    '#0ca789', '#d62d2d', '#d99a00', '#7a5c3e', '#5f6b7a'];
  const HEX = /^#[0-9a-fA-F]{6}$/;
  function isLight(hex) {
    const v = parseInt(hex.slice(1), 16);
    return (0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255)) / 255 > 0.62;
  }
  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = (s) => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
    return '#' + ((1 << 24) + (ch(16) << 16) + (ch(8) << 8) + ch(0)).toString(16).slice(1);
  }
  function surface() {
    const v = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim();
    return HEX.test(v) ? v : '#ffffff';
  }
  function branchColor(n) {
    let b = n;
    while (b.parentId && NODES.get(b.parentId) && NODES.get(b.parentId).parentId) b = NODES.get(b.parentId);
    if (HEX.test(b.color || '')) return b.color;
    return BRANCH_COLORS[Math.max(0, ROOT.children.indexOf(b)) % BRANCH_COLORS.length];
  }
  /** {bg, border, fg, filled, line} for a node, or null for the root. */
  function paintOf(n) {
    if (n === ROOT) return null;
    const c = HEX.test(n.color || '') ? n.color : branchColor(n);
    const filled = NODES.get(n.parentId) === ROOT || HEX.test(n.color || '');
    return filled
      ? { bg: c, border: c, fg: isLight(c) ? '#1c1f26' : '#ffffff', filled: true, line: c }
      : { bg: mix(c, surface(), 0.86), border: c, fg: '', filled: false, line: c };
  }

  function render() {
    const world = $('world');
    world.innerHTML = '';
    const vis = visible(ROOT);
    for (const n of vis) {
      const el = document.createElement('div');
      const p = paintOf(n);
      el.className = 'node' + (n === ROOT ? ' root' : '') + (p && p.filled ? ' filled' : '') + (n.nodeId === SELECTED ? ' sel' : '');
      if (p) {
        el.style.background = p.bg;
        el.style.borderColor = p.border;
        if (p.fg) el.style.color = p.fg;
      }
      el.dataset.id = n.nodeId;
      const dc = docCount(n.nodeId);
      const kind = n.nodeType === 'question' ? 'help' : n.nodeType === 'task' ? 'task_alt' : '';
      el.innerHTML =
        `<div class="lab">${kind ? `<span class="material-symbols-outlined" style="font-size:15px;">${kind}</span> ` : ''}${esc(n.label)}</div>` +
        (n.summary ? `<div class="sum">${esc(n.summary)}</div>` : '') +
        (dc ? `<div class="badges"><span class="badge"><span class="material-symbols-outlined">attach_file</span>${dc}</span></div>` : '') +
        (n.children.length ? `<button class="tog" data-tog="${esc(n.nodeId)}" title="${n.collapsed ? 'Expand' : 'Collapse'}">${n.collapsed ? n.children.length : '−'}</button>` : '');
      world.appendChild(el);
    }
    // Heights are only known once the text has wrapped.
    for (const el of world.children) HEIGHT.set(el.dataset.id, el.offsetHeight);
    layout();
    for (const el of world.children) {
      const n = NODES.get(el.dataset.id);
      el.style.left = n.x + 'px';
      el.style.top = n.y + 'px';
    }
    drawLinks(vis);
    applyView();
  }

  function drawLinks(vis) {
    const shown = new Set(vis.map(n => n.nodeId));
    const mid = n => n.y + (HEIGHT.get(n.nodeId) || 64) / 2;
    const paths = [];
    for (const n of vis) {
      if (!n.parentId || !shown.has(n.parentId)) continue;
      const p = NODES.get(n.parentId);
      const x1 = p.x + W, y1 = mid(p), x2 = n.x, y2 = mid(n), cx = (x1 + x2) / 2;
      const paint = paintOf(n);
      paths.push(`<path d="M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}"${paint ? ` style="stroke:${paint.line}"` : ''}/>`);
    }
    for (const e of DATA.edges) {
      if (!shown.has(e.fromNode) || !shown.has(e.toNode)) continue;
      const a = NODES.get(e.fromNode), b = NODES.get(e.toNode);
      const x1 = a.x + W / 2, y1 = mid(a), x2 = b.x + W / 2, y2 = mid(b);
      paths.push(`<path class="x" d="M${x1},${y1} Q${(x1 + x2) / 2 + 80},${(y1 + y2) / 2} ${x2},${y2}"><title>${esc(e.label || 'related')}</title></path>`);
    }
    $('links').innerHTML = paths.join('');
  }

  // ── pan / zoom ──
  const view = { x: 40, y: 40, k: 1 };
  function applyView() {
    const t = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
    $('world').style.transform = t;
    $('links').style.transform = t;
    $('links').style.transformOrigin = '0 0';
  }
  function fit() {
    const vis = visible(ROOT);
    const minX = Math.min(...vis.map(n => n.x)), maxX = Math.max(...vis.map(n => n.x + W));
    const minY = Math.min(...vis.map(n => n.y)), maxY = Math.max(...vis.map(n => n.y + (HEIGHT.get(n.nodeId) || 64)));
    const st = $('stage').getBoundingClientRect();
    const panelW = $('panel').classList.contains('open') && st.width > 640 ? 404 : 0;
    const k = Math.max(0.25, Math.min(1.2, (st.width - panelW - 60) / (maxX - minX), (st.height - 60) / (maxY - minY)));
    view.k = k;
    view.x = (st.width - panelW - (maxX - minX) * k) / 2 - minX * k;
    view.y = (st.height - (maxY - minY) * k) / 2 - minY * k;
    applyView();
  }
  function zoomAt(f, cx, cy) {
    const k = Math.max(0.2, Math.min(2.5, view.k * f));
    view.x = cx - (cx - view.x) * (k / view.k);
    view.y = cy - (cy - view.y) * (k / view.k);
    view.k = k;
    applyView();
  }
  const stage = $('stage');
  stage.addEventListener('wheel', (e) => {
    // The panel and zoom buttons sit inside the stage. A wheel or trackpad
    // scroll there belongs to them — cancelling it froze the panel's scroll.
    if (e.target.closest('#panel, .zoom')) return;
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  let drag = null;
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('#panel, .zoom, .node')) return;
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', (e) => {
    if (!drag) return;
    view.x = drag.vx + e.clientX - drag.x;
    view.y = drag.vy + e.clientY - drag.y;
    applyView();
  });
  const endDrag = () => { drag = null; stage.classList.remove('dragging'); };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  const centre = () => { const r = stage.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
  $('zin').addEventListener('click', () => zoomAt(1.2, ...centre()));
  $('zout').addEventListener('click', () => zoomAt(1 / 1.2, ...centre()));
  $('zfit').addEventListener('click', () => ROOT && fit());

  // ── node clicks ──
  $('world').addEventListener('click', (e) => {
    const tog = e.target.closest('[data-tog]');
    if (tog) {
      const n = NODES.get(tog.dataset.tog);
      n.collapsed = !n.collapsed;
      render();
      return;
    }
    const el = e.target.closest('.node');
    if (el) select(el.dataset.id);
  });

  function pathOf(id) {
    const out = [];
    for (let n = NODES.get(id); n; n = n.parentId ? NODES.get(n.parentId) : null) out.unshift(n.label);
    return out;
  }

  // Every document offers View and Download. What "View" means depends on
  // what can safely be shown here (the server decides `preview`): an image
  // inline, a PDF in the browser's viewer, anything else as its text. Download
  // is the file itself — or its text as .txt when the original was not kept.
  function docRow(d) {
    const ico = (name) => `<span class="material-symbols-outlined">${name}</span>`;
    // A link: Open always; View when the thing can be shown here (a video, a
    // Google preview, an image). Nothing to download — it is not our file.
    if (d.kind === 'link' && d.link) {
      const L = d.link;
      const view = d.preview ? `<button class="btn" data-linkview="${esc(d.docId)}">${ico('visibility')} View</button>` : '';
      return `<div class="doc">
        <div class="n">${esc(d.filename)}</div>
        <div class="m">${esc([L.provider === 'web' ? 'Web page' : L.kindLabel, L.host].filter(Boolean).join(' · '))}</div>
        <div class="a">${view}<a class="btn" href="${esc(L.href)}" target="_blank" rel="noopener noreferrer">${ico('open_in_new')} Open</a></div></div>`;
    }
    const kind = d.kind === 'text' ? 'Note' : d.kind === 'image' ? 'Image' : 'Document';
    const file = `${API}/docs/${encodeURIComponent(d.docId)}/file`;
    let view = '';
    if (d.preview === 'pdf') {
      view = `<a class="btn" href="${file}" target="_blank" rel="noopener noreferrer">${ico('visibility')} View</a>`;
    } else if (d.preview === 'image') {
      view = `<button class="btn" data-img="${esc(d.docId)}">${ico('visibility')} View</button>`;
    } else if (d.preview === 'text') {
      view = `<button class="btn" data-read="${esc(d.docId)}">${ico('visibility')} View</button>`;
    }
    const dl = d.downloadable
      ? `<a class="btn" href="${file}?download=1" data-dl="${esc(d.filename)}" rel="noopener">${ico('download')} Download${d.hasOriginal ? '' : ' text'}</a>`
      : '';
    const note = !view && dl ? `<div class="m" style="margin-top:6px;">No preview for this type — download it to open.</div>` : '';
    return `<div class="doc">
      <div class="n">${esc(d.filename)}</div>
      <div class="m">${esc([kind, fmtSize(d.size), d.chars ? d.chars.toLocaleString() + ' chars' : ''].filter(Boolean).join(' · '))}</div>
      <div class="a">${view}${dl}</div>${note}</div>`;
  }

  function select(id) {
    SELECTED = id;
    document.querySelectorAll('.node').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
    const n = NODES.get(id);
    $('pPath').textContent = pathOf(id).slice(0, -1).join(' → ') || 'Overview';
    $('pTitle').textContent = n.label;
    const own = DOCS.get(id) || [];
    const mapLevel = id === ROOT.nodeId ? (DOCS.get('') || []) : [];
    let html = '';
    if (n.summary) html += `<p style="margin:0 0 10px; color:var(--fg);">${esc(n.summary)}</p>`;
    if (n.detail) html += `<p style="margin:0; white-space:pre-wrap;">${esc(n.detail)}</p>`;
    if (!n.summary && !n.detail) html += `<p style="margin:0; color:var(--muted);">No notes on this node.</p>`;
    if (own.length) html += `<h3>Documents on this node</h3>` + own.map(docRow).join('');
    if (mapLevel.length) html += `<h3>Sources for the whole map</h3>` + mapLevel.map(docRow).join('');
    if (!DATA.includeDocs && id === ROOT.nodeId) {
      html += `<h3>Documents</h3><p style="margin:0; color:var(--muted); font-size:12.5px;">This link was shared without its documents.</p>`;
    }
    if (n.children.length) {
      html += `<h3>Branches</h3>` + n.children.map(c =>
        `<button class="btn" data-go="${esc(c.nodeId)}" style="margin:0 6px 6px 0;">${esc(c.label)}</button>`).join('');
    }
    $('pBody').innerHTML = html;
    $('pBody').scrollTop = 0;
    $('panel').classList.add('open');
  }

  $('pBody').addEventListener('click', async (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { select(go.dataset.go); return; }
    const dl = e.target.closest('[data-dl]');
    if (dl) { e.preventDefault(); saveFrom(dl.href, dl.dataset.dl, dl); return; }
    const btn = e.target.closest('[data-read], [data-img], [data-linkview]');
    if (!btn) return;
    const row = btn.closest('.doc');
    // View is a toggle: the preview sits inside the row, and a second click
    // closes it again.
    const open = row.querySelector('.preview');
    const label = (on) => { btn.innerHTML = `<span class="material-symbols-outlined">${on ? 'visibility_off' : 'visibility'}</span> ${on ? 'Hide' : 'View'}`; };
    if (open) { open.remove(); label(false); return; }
    label(true);

    if (btn.dataset.linkview) {
      const d = DATA.docs.find(x => x.docId === btn.dataset.linkview);
      const L = d && d.link;
      if (!L) return;
      let el;
      if (d.preview === 'embed') {
        // Named hosts only (the server's CSP frame-src), sandboxed. Origin-only
        // referrer: YouTube will not play an embed that sends none, and the
        // share token is in the fragment, which a referrer never carries.
        el = document.createElement('iframe');
        el.src = L.embedUrl;
        el.loading = 'lazy';
        el.referrerPolicy = 'strict-origin-when-cross-origin';
        el.allow = 'encrypted-media; picture-in-picture; fullscreen';
        el.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-presentation');
        el.allowFullscreen = true;
        el.style.cssText = 'width:100%; aspect-ratio:16/10; border:1px solid var(--line); border-radius:10px; margin-top:9px;';
      } else if (d.preview === 'image-link') {
        el = document.createElement('img');
        el.referrerPolicy = 'no-referrer';
        el.src = L.href;
      } else if (d.preview === 'video-link') {
        el = document.createElement('video');
        el.controls = true;
        el.preload = 'metadata';
        el.src = L.href;
        el.style.cssText = 'width:100%; margin-top:9px; border-radius:10px;';
      }
      if (el) { el.classList.add('preview'); row.appendChild(el); }
      return;
    }

    if (btn.dataset.img) {
      const img = document.createElement('img');
      img.className = 'preview';
      img.alt = row.querySelector('.n').textContent;
      img.src = `${API}/docs/${encodeURIComponent(btn.dataset.img)}/file`;
      row.appendChild(img);
      return;
    }
    const box = document.createElement('div');
    box.className = 'doctext preview';
    box.textContent = 'Loading…';
    row.appendChild(box);
    try {
      const r = await fetch(`${API}/docs/${encodeURIComponent(btn.dataset.read)}`);
      const b = await r.json();
      if (!r.ok) throw new Error(b.error || 'HTTP ' + r.status);
      box.textContent = b.doc.text || '(no text)';
    } catch (err) { box.textContent = 'Could not load: ' + err.message; }
  });
  $('pClose').addEventListener('click', () => { $('panel').classList.remove('open'); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') $('panel').classList.remove('open');
    if (e.key === 'f' && ROOT && !/INPUT|TEXTAREA/.test(e.target.tagName)) fit();
  });
  window.addEventListener('hashchange', () => location.reload());

  load();
})();
</script>
</body>
</html>
