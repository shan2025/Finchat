<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>FinChat | Settings</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/favicon.svg">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link rel="stylesheet" href="finchat_tw.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caprasimo&display=swap" rel="stylesheet">
<link rel="stylesheet" href="finchat_theme.css">
<style>
 /* Ported from the "FinChat Settings" Claude Design import (Settings page
    redesign, project 8c8c78a0). The design's organic tokens are mapped onto
    the shared finchat_theme.css vocabulary here so the page stays inside the
    app's one design system: warm burnt-orange = --accent-warm, the green
    "on / verified" state = --ok, cards = --surface on a --bg ground.

    Every selector is scoped to .set-root (never a bare body/html) because
    spa_router.js adopts this <style> when it swaps <main> — see the
    SPA-router note in memory. */
 .set-root { --set-accent: var(--accent-warm); --set-accent-ink: #fff; --set-on: var(--ok); }

 .set-root { height: 100%; display: flex; flex-direction: column; min-width: 0; }
 .set-scroll { flex: 1; min-height: 0; overflow-y: auto; }

 /* ── page header ── */
 .set-head { display: flex; align-items: flex-end; gap: 20px; padding: 22px 28px 18px;
   border-bottom: 1px solid var(--border); flex: none; flex-wrap: wrap; }
 .set-head h1 { font-family: var(--serif); font-size: 28px; margin: 0 0 3px; letter-spacing: -.01em; color: var(--text); }
 .set-head .sub { font-size: 13px; color: var(--text-2); }
 .set-head .sub b { font-weight: 600; color: var(--text); }
 .set-savebar { display: flex; align-items: center; gap: 10px; margin-left: auto; }

 /* ── secondary settings nav ── */
 .set-body { flex: 1; min-height: 0; display: flex; }
 .set-nav { width: 236px; flex: none; padding: 20px 12px 20px 20px; border-right: 1px solid var(--border);
   overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
 .set-nav-group-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); padding: 0 12px 6px; }
 .set-nav-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font-family: var(--sans);
   font-size: 13.5px; font-weight: 500; color: var(--text-2); background: transparent; border: 1px solid transparent;
   border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: background .12s, color .12s; }
 .set-nav-btn:hover { background: rgba(var(--text-rgb), .06); color: var(--text); }
 .set-nav-btn.active { font-weight: 600; color: var(--accent); background: var(--accent-soft);
   border-color: rgba(var(--accent-warm-rgb), .3); }
 .set-nav-btn .label { flex: 1; }
 .set-nav-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-warm); }
 .set-nav-btn .badge { font-size: 9.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px;
   background: rgba(176,71,46,.12); color: var(--danger); }

 .set-content { flex: 1; min-width: 0; overflow-y: auto; padding: 26px 32px 80px; }
 .set-inner { max-width: 800px; display: flex; flex-direction: column; gap: 20px; }

 /* ── section building blocks ── */
 .set-sec-head h2 { font-family: var(--serif); font-size: 22px; margin: 0 0 5px; color: var(--text); }
 .set-sec-head .kicker { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-warm); margin-bottom: 5px; }
 .set-sec-head p { margin: 0; font-size: 13.5px; color: var(--text-2); max-width: 64ch; text-wrap: pretty; }
 .set-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
 .set-row { display: flex; align-items: center; gap: 14px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
 .set-row:last-child { border-bottom: none; }
 .set-row .rc { flex: 1; min-width: 0; }
 .set-row .rt { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--text); }
 .set-row .rd { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }

 .set-title-row { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
 .set-title-row .grow { flex: 1; min-width: 200px; }

 /* buttons — mapped to the shared button feel */
 .sb { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
   font-family: var(--sans); font-weight: 600; font-size: 13px; line-height: 1.2; border-radius: 999px;
   padding: 8px 16px; border: 1px solid transparent; white-space: nowrap; flex: none; text-decoration: none; }
 .sb-primary { background: var(--accent-warm); color: #fff; }
 .sb-primary:hover { background: var(--accent-warm-hover); }
 .sb-secondary { border-color: var(--border-2); color: var(--text); background: transparent; }
 .sb-secondary:hover { background: rgba(var(--text-rgb), .06); }
 .sb-ghost { color: var(--accent-warm); background: transparent; padding-inline: 6px; }
 .sb-ghost:hover { text-decoration: underline; }
 .sb-danger { color: var(--danger); border-color: rgba(176,71,46,.4); background: transparent; }
 .sb-danger:hover { background: rgba(176,71,46,.07); }
 .sb svg { display: block; }

 /* tags */
 .stag { display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; letter-spacing: .02em;
   padding: 2px 9px; border-radius: 999px; }
 .stag-on { background: rgba(79,138,82,.14); color: var(--ok); }
 .stag-warn { background: rgba(201,154,58,.16); color: var(--warn); }
 .stag-danger { background: rgba(176,71,46,.13); color: var(--danger); }
 .stag-neutral { background: var(--surface-2); color: var(--text-2); }

 /* iOS-style toggle (shared with old page) */
 .tgl { position: relative; width: 44px; height: 24px; border-radius: 999px; background: var(--border-2);
   transition: background .18s; cursor: pointer; flex-shrink: 0; border: none; padding: 0; }
 .tgl::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
   background: #fff; transition: left .18s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
 .tgl.on { background: var(--ok); } .tgl.on::after { left: 22px; }
 .tgl.locked { opacity: .5; cursor: default; }

 .chan-input { width: 100%; max-width: 340px; margin-top: 10px; padding: 8px 14px; border-radius: 999px;
   font-size: 13px; background: var(--bg); border: 1px solid var(--border); outline: none; color: var(--text); }

 /* segmented control */
 .set-seg { display: inline-flex; overflow: hidden; border: 1px solid var(--border-2); border-radius: 999px; background: var(--bg); flex: none; }
 .set-seg button { font-family: var(--sans); font-size: 12.5px; padding: 6px 14px; border: none; background: transparent;
   color: var(--text-2); cursor: pointer; }
 .set-seg button + button { border-left: 1px solid var(--border); }
 .set-seg button.on { background: var(--accent-warm); color: #fff; }

 /* event chips */
 .evchip { display: inline-flex; align-items: center; gap: 7px; font-family: var(--sans); font-size: 13px;
   font-weight: 500; border-radius: 999px; padding: 8px 15px; cursor: pointer; border: 1px solid var(--border-2);
   background: transparent; color: var(--text-2); }
 .evchip.on { font-weight: 600; color: var(--ok); background: rgba(79,138,82,.1); border-color: rgba(79,138,82,.3); }

 /* mono chip */
 .mono-chip { font-family: var(--mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--border);
   border-radius: 999px; padding: 6px 14px; }

 /* stat cards */
 .set-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
 .set-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; }
 .set-stat .k { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
 .set-stat .v { font-family: var(--serif); font-size: 26px; line-height: 1.1; margin-top: 6px; color: var(--text); }
 .set-stat .u { font-size: 12px; color: var(--text-3); }

 .set-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

 .set-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
 .set-table th { text-align: left; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3);
   padding: 10px 8px; border-bottom: 1px solid var(--border); font-weight: 600; }
 .set-table td { padding: 10px 8px; border-bottom: 1px solid rgba(var(--text-rgb), .07); vertical-align: top; }
 .set-table tbody tr:last-child td { border-bottom: none; }

 .set-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
   background: var(--chrome); color: var(--chrome-fg); font-size: 13px; font-weight: 600; padding: 11px 22px;
   border-radius: 999px; box-shadow: var(--shadow-md); opacity: 0; pointer-events: none; transition: all .28s; z-index: 9999; }
 .set-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

 .dlg-back { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; z-index: 9998;
   background: rgba(20,16,10,.5); }
 .dlg { width: min(440px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 22px;
   border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-md); }
 .dlg-title { font-family: var(--serif); font-size: 20px; color: var(--text); }
 .dlg-body { font-size: 13.5px; color: var(--text-2); }
 .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

 /* ── animated proof-of-conversation chain (ported from finchat_blockchain.html,
    the "blocks were moving" view) — re-tokenised so it themes with the app ── */
 .set-root #chainViewport { overflow: hidden; position: relative; }
 .set-root #chainTrack { display: flex; align-items: center; gap: 0; width: max-content; animation: setChainDrift 40s linear infinite; }
 .set-root #chainTrack:hover { animation-play-state: paused; }
 @keyframes setChainDrift { 0% { transform: translateX(0); } 50% { transform: translateX(calc(-100% + min(100%, 780px))); } 100% { transform: translateX(0); } }
 .set-root .blk { position: relative; min-width: 156px; max-width: 156px; border-radius: 16px; padding: 12px 14px; background: var(--surface); border: 1.5px solid var(--border); transition: transform .15s, box-shadow .15s; cursor: pointer; }
 .set-root .blk:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); z-index: 2; }
 .set-root .blk.anchored { border-color: var(--accent-warm); background: linear-gradient(160deg, var(--surface) 55%, var(--accent-soft)); }
 .set-root .blk.genesis { border-color: var(--ok); }
 .set-root .blk-link { width: 34px; height: 3px; background: repeating-linear-gradient(90deg, var(--text-3) 0 5px, transparent 5px 9px); position: relative; flex-shrink: 0; overflow: visible; }
 .set-root .blk-link::after { content: ''; position: absolute; top: -2.5px; left: -8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-warm); animation: setLinkPulse 1.6s linear infinite; will-change: transform; }
 @keyframes setLinkPulse { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(42px); opacity: 0; } }
 @keyframes setBlockIn { from { transform: scale(.6) translateY(10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
 .set-root .blk.new { animation: setBlockIn .5s cubic-bezier(.2,.9,.3,1.2); }
 .set-root .live-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
 @keyframes setLivePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(79,138,82,.5); } 60% { box-shadow: 0 0 0 7px rgba(79,138,82,0); } }
 .set-root .live-dot.ok { background: var(--ok); animation: setLivePulse 1.8s infinite; }
 .set-root .live-dot.bad { background: var(--danger); }
 .set-root .chain-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
 @media (max-width: 720px) { .set-root .chain-stats { grid-template-columns: repeat(2, 1fr); } }

 #sideNav { transition: transform .25s ease; }
 @media (max-width: 991px) { .set-nav { width: 190px; } }
 @media (max-width: 767px) {
  #sideNav { transform: translateX(-100%); z-index: 60; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  #sideNav.open { transform: translateX(0); }
  .set-body { flex-direction: column; }
  .set-nav { width: 100%; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border);
    gap: 10px; padding: 12px 16px; }
  .set-nav-group-label { display: none; }
  .set-nav > div { flex-direction: row !important; }
  .set-content { padding: 20px 16px 60px; }
  .set-stats, .set-grid2 { grid-template-columns: 1fr; }
 }
 @media (min-width: 768px) { #sideNav { transform: none !important; } }
</style>
</head>

<body class="bg-cream-bg h-screen overflow-hidden">

<nav id="sideNav" class="flex flex-col h-full py-8 px-4 fixed left-0 top-0 w-64 bg-primary-brown z-40 text-cream-bg"></nav>

<!-- Everything the view owns lives inside this one <main>: spa_router.js swaps
     only <main>, so a header/backdrop/toast left outside it would belong to
     whichever page loaded first and never be replaced. -->
<main class="flex flex-col md:ml-64 h-full min-w-0">

 <div id="navBackdrop" class="hidden md:hidden fixed inset-0 z-[55]" style="background: rgba(0,0,0,.45);"></div>

 <div class="set-root">

  <!-- ── header + save bar ── -->
  <div class="set-head">
   <button id="navToggle" title="Menu" class="w-9 h-9 flex md:hidden items-center justify-center rounded-full shrink-0" style="background:var(--surface-2); border:1px solid var(--border);">
    <span class="material-symbols-outlined text-[18px]">menu</span>
   </button>
   <div style="flex:1; min-width:0;">
    <h1>Settings</h1>
    <div class="sub">Workspace preferences, connections and the trust record for <b id="hdName">—</b> · <span id="hdRole">user</span></div>
   </div>
   <div class="set-savebar">
    <span id="cleanState" style="display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--text-3);">
     <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
     All changes saved
    </span>
    <span id="dirtyState" style="display:none; align-items:center; gap:10px;">
     <span style="font-size:12px; color:var(--accent-warm);">Unsaved changes</span>
     <button id="discardBtn" class="sb sb-secondary">Discard</button>
     <button id="saveBtn" class="sb sb-primary" style="padding-inline:20px;">Save changes</button>
    </span>
    <div class="relative shrink-0">
     <button id="notifBell" title="Notifications" class="w-9 h-9 flex items-center justify-center rounded-full relative" style="background:var(--surface-2); border:1px solid var(--border);">
      <span class="material-symbols-outlined text-[16px]">notifications</span>
      <span id="notifBadge" class="hidden absolute -top-0.5 -right-0.5 min-w-[16px] h-[16px] px-1 bg-[#dc2626] text-white text-[10px] font-bold leading-[16px] rounded-full text-center"></span>
     </button>
     <div id="notifDropdown" class="hidden absolute right-0 top-11 w-80 max-h-96 overflow-y-auto rounded-2xl shadow-xl z-[200]" style="background:var(--surface);border:1px solid var(--border);">
      <div class="flex items-center justify-between px-4 py-3 border-b sticky top-0" style="border-color:var(--border);background:var(--surface);">
       <span class="text-sm font-bold" style="color:var(--text)">Notifications</span>
       <button id="notifMarkAll" class="text-[11px] font-semibold" style="color:var(--text-3)">Mark all read</button>
      </div>
      <div id="notifList"></div>
     </div>
    </div>
   </div>
  </div>

  <!-- ── body: secondary nav + content ── -->
  <div class="set-body">
   <nav class="set-nav" id="setNav"><!-- built by JS --></nav>
   <div class="set-content">
    <div class="set-inner" id="setPanel"><!-- section rendered by JS --></div>
   </div>
  </div>

 </div>

 <div class="set-toast" id="toast"></div>
 <div id="dialogHost"></div>

<script>
 // ─────────────────────────────────────────────────────────────────────────
 // Session / API plumbing (unchanged contract from the previous Settings page).
 // ─────────────────────────────────────────────────────────────────────────
 const _session = JSON.parse(sessionStorage.getItem('finchat_user') || localStorage.getItem('finchat_session') || 'null');
 if (!_session) window.location.href = 'finchat_login.html';
 else if (!sessionStorage.getItem('finchat_user')) sessionStorage.setItem('finchat_user', JSON.stringify(_session));
 const SESSION_USER = _session || {};
 const token = localStorage.getItem('finchat_token') || sessionStorage.getItem('finchat_token') || SESSION_USER.token || '';
 const AUTH = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
 const API = location.protocol.indexOf('http') === 0 ? location.origin : 'http://localhost:3000';
 const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const $ = id => document.getElementById(id);
 function showToast(msg) { const t = $('toast'); t.textContent = msg; t.className = 'set-toast show'; clearTimeout(showToast._t); showToast._t = setTimeout(() => t.className = 'set-toast', 3600); }
 function fmtTime(t) { try { return new Date(t).toLocaleString(); } catch (e) { return ''; } }

 $('hdName').textContent = SESSION_USER.name || SESSION_USER.username || 'you';
 $('hdRole').textContent = (SESSION_USER.role || 'user');

 // ── shared state ──
 const state = {
   section: 'notifications',
   dirty: false,
   prefs: {}, serverChannels: {}, waStatus: {}, deliveries: [],
   gStatus: {},
   chain: null, blocks: [],
   providers: null, // { catalogue, keys, access, referral }
   addKeyRows: 1,   // how many blank "add a key" rows are showing
   appearance: {
     theme: (localStorage.getItem('finchat_theme_mode') || 'system'),
     rail: (localStorage.getItem('finchat_nav_collapsed') === '1' ? 'Collapsed' : 'Expanded'),
     density: (localStorage.getItem('finchat_density') || 'Comfortable')
   },
   connectRequested: {}
 };

 function setDirty(v) {
   state.dirty = v;
   $('cleanState').style.display = v ? 'none' : 'inline-flex';
   $('dirtyState').style.display = v ? 'inline-flex' : 'none';
 }

 // Apply the chosen colour theme (Light / Dark / System). The app's dark
 // palette lives in finchat_theme.css behind html[data-theme="dark"]; this is
 // the control that opts into it. "System" follows prefers-color-scheme.
 function applyTheme(mode) {
   const root = document.documentElement;
   let dark = mode === 'Dark';
   if (mode === 'System') dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
   if (dark) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
 }
 applyTheme(({ light: 'Light', dark: 'Dark', system: 'System' })[state.appearance.theme] || 'System');

 // ─────────────────────────────────────────────────────────────────────────
 // Navigation model
 // ─────────────────────────────────────────────────────────────────────────
 const NAV = [
   { label: 'Preferences', items: [['notifications', 'Notifications'], ['appearance', 'Appearance']] },
   { label: 'Connections', items: [['ai', 'Bring Your Own AI'], ['connections', 'Connected accounts'], ['log', 'Delivery log']] },
   { label: 'Trust & records', items: [['audit', 'Security & audit'], ['chain', 'Blockchain anchoring']] },
   { label: 'Account', items: [['account', 'Account & profile']] }
 ];
 function failCount() { return (state.deliveries || []).filter(d => ['failed', 'unconfigured'].includes(d.status)).length; }

 function renderNav() {
   $('setNav').innerHTML = NAV.map(g => `
     <div style="display:flex; flex-direction:column; gap:2px;">
       <div class="set-nav-group-label">${g.label}</div>
       ${g.items.map(([id, label]) => {
         const active = state.section === id;
         const fails = id === 'log' && !active ? failCount() : 0;
         return `<button class="set-nav-btn ${active ? 'active' : ''}" data-go="${id}">
           <span class="label">${label}</span>
           ${active ? '<span class="dot"></span>' : (fails ? `<span class="badge">${fails} failed</span>` : '')}
         </button>`;
       }).join('')}
     </div>`).join('');
 }

 function go(id) { state.section = id; renderNav(); renderSection(); $('setContentScroll') && ($('setContentScroll').scrollTop = 0); }

 // ─────────────────────────────────────────────────────────────────────────
 // Section renderers
 // ─────────────────────────────────────────────────────────────────────────
 function renderSection() {
   const panel = $('setPanel');
   const r = ({
     notifications: secNotifications, appearance: secAppearance, connections: secConnections,
     ai: secAI, log: secLog, audit: secAudit, chain: secChain, account: secAccount
   })[state.section];
   panel.innerHTML = r ? r() : '';
   if (r && r.after) r.after();
 }

 // ── Notifications ──
 const CHANNELS = [
   { key: 'inapp',    label: 'In-app bell', desc: 'The bell on every FinChat page.', locked: true, field: null },
   { key: 'push',     label: 'Mobile / browser push', desc: 'Real push on this device, even with FinChat closed.', field: null },
   { key: 'email',    label: 'Email', desc: 'One email per notification.', field: 'email_to', placeholder: 'you@example.com' },
   { key: 'whatsapp', label: 'WhatsApp', desc: 'Link your number — message FinChat once and we confirm it.', field: 'whatsapp_to', placeholder: '+91 98765 43210' },
   { key: 'telegram', label: 'Telegram', desc: 'Message the bot once and we capture your chat ID.', field: 'telegram_chat_id', placeholder: 'e.g. 123456789' },
   { key: 'sms',      label: 'SMS', desc: 'Text message via Twilio.', field: 'sms_to', placeholder: '+91 98765 43210' }
 ];
 const EVENTS = [
   ['approvals', 'Approvals needed'], ['fraud', 'Fraud flags'],
   ['briefings', 'Daily briefings'], ['tasks', 'Task finished']
 ];

 function channelRowHtml(c) {
   const on = c.locked ? true : !!state.prefs['channel_' + c.key];
   const serverMissing = c.key !== 'inapp' && c.key !== 'push' && state.serverChannels[c.key] === false;
   const badge = c.locked ? '<span class="stag stag-neutral">always on</span>'
     : serverMissing ? '<span class="stag stag-warn">needs setup</span>' : '';
   return `
   <div class="set-row" style="flex-direction:column; align-items:stretch; gap:0; ${serverMissing && !on ? 'opacity:.72;' : ''}">
     <div style="display:flex; align-items:center; gap:14px;">
       <div class="rc">
         <div class="rt">${c.label} ${badge}</div>
         <div class="rd">${c.desc}</div>
       </div>

 // The cached session is whatever login wrote months ago — name, role and
 // avatar can all have moved on since. /api/auth/me is the source of truth.
 async function refreshUser() {
   try {
     const r = await fetch(API + '/api/auth/me', { headers: AUTH });
     if (!r.ok) return;
     const d = await r.json();
     if (!d || !d.user) return;
     Object.assign(SESSION_USER, d.user);
     try {
       sessionStorage.setItem('finchat_user', JSON.stringify(SESSION_USER));
       if (localStorage.getItem('finchat_session')) localStorage.setItem('finchat_session', JSON.stringify(SESSION_USER));
     } catch (e) { /* storage full or blocked — the in-memory copy still updates */ }
     $('hdName').textContent = SESSION_USER.name || SESSION_USER.username || 'you';
     $('hdRole').textContent = (SESSION_USER.role || 'user');
     if (state.section === 'account') renderSection();
   } catch (e) { /* offline — keep showing the cached identity */ }
 }

 async function loadPrefs() {
   try {
     const r = await fetch(API + '/api/settings/notifications', { headers: AUTH });
     if (!r.ok) throw new Error('load failed');
     const d = await r.json();
     state.prefs = d.prefs || {};
     state.serverChannels = d.serverChannels || {};

     state.deliveries = d.recentDeliveries || [];

 async function savePrefs() {
   const body = {};
   for (const c of CHANNELS) {
     if (c.locked) continue;
     body['channel_' + c.key] = !!state.prefs['channel_' + c.key];
     if (c.field) { const f = $('fld_' + c.field); if (f) body[c.field] = f.value.trim(); }
   }
   body.muted_types = EVENTS.map(([k]) => k).filter(k => (state.prefs.muted_types || []).includes(k));
   // Appearance is device-local — persisted straight to localStorage.
   localStorage.setItem('finchat_theme_mode', (state.appearance.theme));
   localStorage.setItem('finchat_density', state.appearance.density);
   try {
     const r = await fetch(API + '/api/settings/notifications', { method: 'PUT', headers: AUTH, body: JSON.stringify(body) });
     if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'save failed');
     const d = await r.json();
     state.prefs = d.prefs; if (d.whatsapp) state.waStatus = d.whatsapp;
     setDirty(false);
     showToast('Settings saved');
     if (state.section === 'notifications') renderSection();
   } catch (e) { showToast('Save failed: ' + e.message); }
 }

 function toggleChannel(key) {
   state.prefs['channel_' + key] = !state.prefs['channel_' + key];

   }

 function toggleEvent(k) {
   const m = new Set(state.prefs.muted_types || []);

 // ── Web Push ──
 function b64ToUint8(base64) {
   const pad = '='.repeat((4 - base64.length % 4) % 4);
   const b = (base64 + pad).replace(/-/g, '+').replace(/_/g, '/');
   const raw = atob(b); return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
 }
 async function enablePush() {
   try {
     if (!('serviceWorker' in navigator) || !('PushManager' in window)) { showToast('This browser does not support push'); return false; }
     const perm = await Notification.requestPermission();
     if (perm !== 'granted') { showToast('Push permission was denied'); return false; }
     const reg = await navigator.serviceWorker.register('sw.js');
     const keyRes = await fetch(API + '/api/settings/push/public-key', { headers: AUTH });
     if (!keyRes.ok) { showToast('Push unavailable on the server'); return false; }
     const { publicKey } = await keyRes.json();
     const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToUint8(publicKey) });
     const saveRes = await fetch(API + '/api/settings/push/subscribe', { method: 'POST', headers: AUTH, body: JSON.stringify({ subscription: sub.toJSON() }) });
     if (!saveRes.ok) { showToast('Could not save push subscription'); return false; }
     showToast('Push enabled on this device'); return true;
   } catch (e) { showToast('Push setup failed: ' + e.message); return false; }
 }

 // ── Telegram / WhatsApp auto-link (polling, released on teardown) ──
 let tgPollTimer = null, waPollTimer = null;
 async function linkTelegram() {
   const status = $('tgLinkStatus');
   try {
     if (status) status.textContent = 'Preparing your link…';
     const r = await fetch(API + '/api/settings/telegram/start-link', { method: 'POST', headers: AUTH });
     const d = await r.json();
     if (!r.ok) throw new Error(d.error || 'could not start linking');
     window.open(d.deepLink, '_blank');
     if (status) status.innerHTML = `Opened <b>@${esc(d.botUsername)}</b>. In Telegram, press <b>Start</b>. Waiting…`;
     let tries = 0; clearInterval(tgPollTimer);
     tgPollTimer = setInterval(async () => {
       if (++tries > 40) { clearInterval(tgPollTimer); if (status) status.textContent = 'Timed out. Tap “Re-link Telegram” to try again.'; return; }
       try {
         const pd = await (await fetch(API + '/api/settings/telegram/poll?code=' + encodeURIComponent(d.code), { headers: AUTH })).json();
         if (pd.linked) { clearInterval(tgPollTimer); state.prefs.channel_telegram = true; state.prefs.telegram_chat_id = pd.chatId; setDirty(true); renderSection(); showToast('Telegram linked (chat ' + pd.chatId + ')'); }
         else if (pd.expired) { clearInterval(tgPollTimer); if (status) status.textContent = 'Link code expired. Try again.'; }
       } catch (err) { /* keep polling */ }
     }, 2000);
   } catch (err) { if (status) status.textContent = 'Could not start linking: ' + err.message; }
 }
 async function linkWhatsApp() {
   const status = $('waLinkStatus');
   try {
     if (status) status.textContent = 'Preparing your link…';
     const r = await fetch(API + '/api/settings/whatsapp/start-link', { method: 'POST', headers: AUTH });
     const d = await r.json();
     if (!r.ok) throw new Error(d.error || 'could not start linking');
     window.open(d.deepLink, '_blank');
     if (status) status.innerHTML = `Waiting for your WhatsApp message… send <b>${esc(d.linkMessage)}</b>${d.senderNumber ? ' to <b>' + esc(d.senderNumber) + '</b>' : ''}.`;
     let tries = 0; clearInterval(waPollTimer);
     waPollTimer = setInterval(async () => {
       if (++tries > 60) { clearInterval(waPollTimer); if (status) status.textContent = 'Timed out. Tap “Re-link WhatsApp” to try again.'; return; }
       try {
         const pd = await (await fetch(API + '/api/settings/whatsapp/poll?code=' + encodeURIComponent(d.code), { headers: AUTH })).json();
         if (pd.linked) { clearInterval(waPollTimer); state.prefs.channel_whatsapp = true; state.prefs.whatsapp_to = pd.to; if (pd.whatsapp) state.waStatus = pd.whatsapp; setDirty(true); renderSection(); showToast('WhatsApp linked (' + pd.to + ')'); }
         else if (pd.expired) { clearInterval(waPollTimer); if (status) status.textContent = 'Link code expired. Try again.'; }
       } catch (err) { /* keep polling */ }
     }, 2000);
   } catch (err) { if (status) status.textContent = 'Could not start linking: ' + err.message; }
 }

 const bind = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };

 bind('discardBtn', 'click', discard);
 bind('notifBell', 'click', e => window.toggleNotifications && window.toggleNotifications(e));
 bind('notifMarkAll', 'click', () => window.markAllNotifsRead && window.markAllNotifsRead());

 bind('setPanel', 'click', e => {
   const t = e.target;
   let el;
   if ((el = t.closest('[data-toggle]'))) return toggleChannel(el.dataset.toggle);
   if ((el = t.closest('[data-ev]'))) return toggleEvent(el.dataset.ev);
   if ((el = t.closest('[data-tglink]'))) return linkTelegram();
   if ((el = t.closest('[data-walink]'))) return linkWhatsApp();
   if (t.id === 'testBtn' || t.closest('#testBtn')) return sendTest();
   if (t.id === 'logoutBtn' || t.closest('#logoutBtn')) return logout();
   if ((el = t.closest('[data-gmail]'))) return el.dataset.gmail === 'connect' ? connectGoogle() : askDisconnectGmail();
   if ((el = t.closest('[data-ai-save]'))) return saveProviderKey(el.dataset.aiSave);
   if ((el = t.closest('[data-ai-addrow]'))) return addKeyRow();
   if ((el = t.closest('[data-ai-rmrow]'))) return removeKeyRow();
   if ((el = t.closest('[data-ai-test]'))) return testProviderKey(el.dataset.aiTest);
   if ((el = t.closest('[data-ai-del]'))) return deleteProviderKey(el.dataset.aiDel);
   if ((el = t.closest('[data-ref-apply]'))) return applyReferralCode();
   if ((el = t.closest('[data-copy]'))) return copyText(el.dataset.copy);
   if ((el = t.closest('[data-connect]'))) {
     const name = el.dataset.connect; state.connectRequested[name] = true; renderSection();
     return showToast(name + ' — request noted; this connector is coming soon.');
   }
   if ((el = t.closest('[data-opt]'))) { const seg = el.closest('[data-seg]'); return pickSeg(seg.dataset.seg, el.dataset.opt); }
   if ((el = t.closest('[data-blkclose]'))) { const d = $('setBlockDetail'); if (d) d.style.display = 'none'; return; }
   if ((el = t.closest('[data-blk]'))) return showChainBlock(+el.dataset.blk);
 });
 // Editing a channel field or the display name marks the form dirty.
 bind('setPanel', 'input', e => {
   // BYOK key/referral inputs and the role selector save on their own, not via
   // the global savebar.
   if (/^(aikey_|aiprov_|refCode)/.test(e.target.id)) return;
   if (e.target.hasAttribute && e.target.hasAttribute('data-ai-role')) return;
   if (e.target.classList.contains('chan-input')) setDirty(true);
 });
 bind('setPanel', 'change', e => {
   const el = e.target.closest && e.target.closest('[data-ai-role]');
   if (el) setProviderRole(el.dataset.aiRole, el.value);
 });

 bind('dialogHost', 'click', e => {
   const b = e.target.closest('[data-dlg]');
   if (e.target.id === 'dlgBack' || (b && b.dataset.dlg === 'close')) return ($('dialogHost').innerHTML = '');
   if (b && b.dataset.dlg === 'confirm') return disconnectGmail();
 });

 bind('navToggle', 'click', () => { $('sideNav').classList.toggle('open'); $('navBackdrop').classList.toggle('hidden'); });
 bind('navBackdrop', 'click', () => { $('sideNav').classList.remove('open'); $('navBackdrop').classList.add('hidden'); });

 // Link-confirmation polls start from a click, after the router's boot-time
 // timer tracking stops — release them by hand on teardown.
 if (window.fcView) window.fcView.onTeardown(() => { clearInterval(tgPollTimer); clearInterval(waPollTimer); });

 // ── boot ──
 reportOAuthOutcome();
 // Deep link: finchat_settings.html#account (the sidebar profile card uses it).
 (function openHashSection() {
   const id = (location.hash || '').replace('#', '');
   if (id && NAV.some(g => g.items.some(it => it[0] === id))) state.section = id;
 })();
 renderNav();
 renderSection();
 refreshUser();
 loadPrefs();
 loadIntegrations();
 loadChain();
 loadProviders();
</script>
</main>
