<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>FinChat - Create Account</title>
<!-- Google Fonts: Inter and Playfair Display -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          beige: '#f6f3eb',
          darkBrown: '#3a2b1c',
          textMuted: '#6B7280',
          borderLight: '#e0e0e0',
        },
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          serif: ['Playfair Display', 'serif'],
        }
      }
    }
  }
</script>
<style>
  body {
    background-color: #f6f3eb;
    margin: 0;
    overflow-x: hidden;
  }
  
  .scene-wrapper {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding-top: 140px; /* Space for the robot to peek/walk */
  }

  .robot-container {
    position: absolute;
    top: 50%;
    right: 0px; 
    margin-top: -80px; 
    margin-right: -100px; 
    z-index: 0;
    transform: rotate(90deg) translateY(120px); 
    animation: peek-from-right 12s infinite cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* SVG Animation internal parts */
  .robot-eye {
    transform-origin: center;
    animation: blink 4s infinite;
  }
  
  .robot-head {
    transform-origin: center 70px;
    animation: head-tilt 12s infinite cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes peek-from-right {
    0%, 15% { transform: rotate(90deg) translateY(120px); }
    20%, 35% { transform: rotate(90deg) translateY(0px); }
    40%, 65% { transform: rotate(90deg) translateY(12px) translateX(3px); }
    70%, 85% { transform: rotate(90deg) translateY(0px) translateX(-3px); }
    90%, 100% { transform: rotate(90deg) translateY(120px); }
  }

  @keyframes head-tilt {
    0%, 40% { transform: rotate(0deg); }
    45%, 52% { transform: rotate(8deg); }
    57%, 65% { transform: rotate(-6deg); }
    70%, 100% { transform: rotate(0deg); }
  }

  @keyframes blink {
    0%, 96% { transform: scaleY(1); }
    98% { transform: scaleY(0.1); }
    100% { transform: scaleY(1); }
  }

  .login-card {
    position: relative;
    z-index: 10;
    background: white;
    border-radius: 4px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    border: 1px solid rgba(0,0,0,0.03);
  }
  
  .custom-input {
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    padding: 0.85rem 1rem;
    font-size: 0.875rem;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
    color: #374151;
  }
  .custom-input::placeholder {
    color: #9ca3af;
  }
  .custom-input:focus {
    border-color: #3a2b1c;
  }
</style>
</head>
<body class="flex items-center justify-center min-h-screen">

  <div class="scene-wrapper">
    <!-- Animated Robot SVG -->
    <div class="robot-container w-[110px] h-[95px]">
      <svg viewBox="0 0 110 95" fill="none" xmlns="http://www.w3.org/2000/svg">
        
        <g class="robot-head">
          <!-- Body (hidden mostly, but here for the shoulders) -->
          <path d="M25 80 C 25 65, 85 65, 85 80 L 85 95 L 25 95 Z" fill="#3a2b1c" />
          
          <!-- Antenna Top -->
          <circle cx="55" cy="12" r="5" fill="#3a2b1c" />
          <line x1="55" y1="16" x2="55" y2="28" stroke="#3a2b1c" stroke-width="3" />
          
          <!-- Side Nubs -->
          <path d="M 23 48 Q 17 48 17 41 Q 17 34 23 34 Z" fill="#3a2b1c" />
          <path d="M 87 48 Q 93 48 93 41 Q 93 34 87 34 Z" fill="#3a2b1c" />
          
          <!-- Main Head -->
          <rect x="25" y="27" width="60" height="46" rx="22" fill="#3a2b1c" />
          
          <!-- Face Screen -->
          <rect x="35" y="37" width="40" height="26" rx="12" fill="#f6f3eb" />
          
          <!-- Eyes -->
          <g class="robot-eye" style="transform-origin: 46px 48px;">
            <circle cx="46" cy="48" r="4.5" fill="#3a2b1c" />
          </g>
          <g class="robot-eye" style="transform-origin: 64px 48px;">
            <circle cx="64" cy="48" r="4.5" fill="#3a2b1c" />
          </g>
          
          <!-- Arms/Hands resting on the edge -->
          <circle cx="22" cy="85" r="10" fill="#3a2b1c" />
          <circle cx="88" cy="85" r="10" fill="#3a2b1c" />
          <!-- Small fingers accent -->
          <path d="M 18 80 Q 22 76 26 80" stroke="#f6f3eb" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
          <path d="M 84 80 Q 88 76 92 80" stroke="#f6f3eb" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
        </g>
      </svg>
    </div>

    <!-- Main Create Account Card -->
    <div class="login-card p-10 flex flex-col w-full text-center">
      <h1 class="font-serif text-[44px] leading-tight text-[#1a1a1a] mb-2 tracking-tight">FinChat</h1>
      <p class="text-gray-500 text-[15px] mb-8 font-medium tracking-wide">Create Account</p>
      
      <form id="signupForm" class="flex flex-col gap-4 text-left">
        <div>
          <input id="full_name" type="text" placeholder="Full Name" class="custom-input" required autocomplete="name">
        </div>
        <div>
          <input id="institutional_id" type="email" placeholder="Email address" class="custom-input" required autocomplete="email">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <input id="decryption_key" type="password" placeholder="Password" class="custom-input" required autocomplete="new-password">
          <input id="confirm_password" type="password" placeholder="Confirm Password" class="custom-input" required autocomplete="new-password">
        </div>
        
        <button type="button" id="signupBtn" onclick="handleSignup()" class="w-full bg-darkBrown hover:bg-[#2e2216] transition-colors text-white font-medium text-[15px] py-[14px] rounded-[4px] shadow-sm mt-3">
          Create account
        </button>
      </form>
      
      <div class="flex items-center gap-3 my-7">
        <div class="h-[1px] bg-gray-200 flex-1"></div>
        <span class="text-[11px] text-gray-400 font-medium uppercase tracking-wider">Or</span>
        <div class="h-[1px] bg-gray-200 flex-1"></div>
      </div>
      
      <button type="button" onclick="handleGoogleSignIn()" class="w-full bg-white border border-gray-200 hover:bg-gray-50 transition-colors text-gray-600 font-medium text-[14px] py-[12px] rounded-[4px] shadow-sm flex items-center justify-center gap-3">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
      
      <p class="mt-8 text-[13px] text-gray-500 font-medium">
        Already have an account? <a href="finchat_login.html" class="text-darkBrown hover:underline ml-1">Sign In</a>
      </p>
    </div>
  </div>

<script>
    // Configuration
    const API_URL = 'http://localhost:3000';
  
    // Pressing Enter triggers signup
    document.getElementById('confirm_password').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') handleSignup();
    });
  
    async function handleSignup() {
      const btn = document.getElementById('signupBtn');
      const origText = btn.innerHTML;
      btn.innerHTML = 'Creating Account...';
      btn.disabled = true;
  
      const name = document.getElementById('full_name').value;
      const email = document.getElementById('institutional_id').value;
      const password = document.getElementById('decryption_key').value;
      const confirmPassword = document.getElementById('confirm_password').value;
  
      if (!name || !email || !password || !confirmPassword) {
          alert("Please fill out all fields.");
          btn.innerHTML = origText;
          btn.disabled = false;
          return;
      }

      if (password !== confirmPassword) {
          alert("Passwords do not match.");
          btn.innerHTML = origText;
          btn.disabled = false;
          return;
      }
  
      try {
        const res = await fetch(`${API_URL}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        
        const data = await res.json();
  
        if (!res.ok) {
          alert(data.error || 'Registration failed. Please try again.');
          btn.innerHTML = origText;
          btn.disabled = false;
          return;
        }
        
        // Auto-login and redirect to link wallet step
        const currentUser = {
          name: data.user.name,
          email: data.user.email,
          role: data.user.role,
          token: data.token,
          id: data.user.id,
          token_balance: data.user.token_balance,
          wallet: data.user.wallet_address,
          method: 'password'
        };
        sessionStorage.setItem('finchat_user', JSON.stringify(currentUser));
        sessionStorage.setItem('finchat_token', data.token);
        localStorage.setItem('finchat_token', data.token);
        window.location.href = 'finchat_link_wallet.html';
      } catch (err) {
        console.error(err);
        alert('Backend unreachable or error occurred.');
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    }

    function handleGoogleSignIn() {
        alert("Google Sign In is not currently configured in the backend.");
    }
</script>

</body>
</html>
