<title>Report Cards Demo</title>
<!--

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  .rcd-body { margin: 0; padding: 32px 16px; background: var(--bg, #f3ead8); font-family: var(--sans, Figtree, sans-serif); }

  .rcd-wrap h1 { font-size: 18px; margin: 0 0 16px; }
  .rcd-composer { position: sticky; bottom: 0; max-width: 840px; margin: 16px auto 0; }
  .rcd-composer textarea { width: 100%; box-sizing: border-box; height: 64px; padding: 14px 18px; border-radius: 22px; border: 1px solid #e3d3ba; background: #fffaf0; font: inherit; resize: none; }
