<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinChat | Study Blocks — design harness</title>
<!--
  Sprint Z · Track B — a static harness for the study-card system.
  Not linked from the sidebar: it exists so the nine block types can be
  eyeballed (and regression-checked) without a live model round-trip.
  Open at /study_blocks_demo.html while the backend is running.
-->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caprasimo&display=swap" rel="stylesheet">
<link rel="stylesheet" href="finchat_theme.css">
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<style>
  body { font-family:var(--sans); background:var(--bg); color:var(--text); margin:0; padding:40px 20px; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-family:'Caprasimo',serif; font-size:28px; font-weight:400; margin:0 0 4px; }
  .sub { color:#8a7d6a; font-size:13px; margin-bottom:24px; }
  .bar { display:flex; gap:8px; margin-bottom:24px; }
  .bar button { border:1px solid #e3d3ba; background:#fffaf0; border-radius:999px; padding:7px 15px;
                font-family:inherit; font-size:12.5px; font-weight:700; color:#8a7d6a; cursor:pointer; }
  .bar button:hover { border-color:#c67139; color:#c67139; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Study Blocks</h1>
  <div class="sub">All nine types, rendered by <code>study_blocks.js</code> from the same JSON the model emits.</div>
  <div class="bar">
    <button onclick="paint('all')">All types</button>
    <button onclick="paint('answer')">A realistic answer</button>
    <button onclick="paint('broken')">Malformed &amp; hostile input</button>
  </div>
  <div id="out"></div>
</div>

<script src="study_blocks.js"></script>
<script>
const F = j => '```studyblock\n' + JSON.stringify(j) + '\n```';

const ALL = [
  { type:'card', title:'End With Forward Pull', kicker:'THE LAST LINE OF EACH BEAT SHOULD DRAG THE NEXT ONE FORWARD',
    body:'A reader stops when a section *feels* finished. Close on an open loop instead — a consequence you have not named yet, or a number you have not explained.',
    howToUse:['End sections on tension, not closure','Name the question the next section answers','Cut the summarising last sentence'],
    usefulFor:'Carousels, reels, scripts, long-form' },
  { type:'flow', title:'The Three-Beat Open', steps:['Hook','Mini answer','Twist'], caption:'Each beat is one screen. The twist is what earns the scroll.' },
  { type:'compare', title:'Raise the Stakes',
    left:{ label:'Low stakes', text:'"Here is a tip that might help your writing."' },
    right:{ label:'High stakes', text:'"This is the line that decides whether anyone reads the second paragraph."' },
    caption:'Same claim. Only the consequence changed.' },
  { type:'steps', title:'Rewriting a Flat Opener', steps:[
      { label:'Find the promise', text:'What does the reader get by the end? Write it in one sentence.' },
      { label:'Move it up', text:'Put that sentence in the first two lines.' },
      { label:'Delete the runway', text:'Everything you wrote before it was you warming up.' }] },
  { type:'note', title:'The twist', body:'The best hook is usually the third sentence you wrote — not the first.' },
  { type:'keyterms', title:'Vocabulary', terms:[
      { term:'Open loop', definition:'A question raised but deliberately left unanswered, so attention carries forward.' },
      { term:'Forward pull', definition:'The pressure a line puts on the reader to continue rather than stop.' },
      { term:'Runway', definition:'The throat-clearing sentences before the real opening.' }] },
  { type:'formula', title:'Attention Decay', expression:'A(n) = A0 × r^n', legend:[
      { symbol:'A0', meaning:'attention on the first line' },
      { symbol:'r', meaning:'retention per beat — every closure drops it' },
      { symbol:'n', meaning:'beat number' }], caption:'Closure lowers r. Tension holds it near 1.' },
  { type:'checkpoint', questions:[
      { question:'Why does ending a section on closure cost you readers?', answer:'Closure signals "you may stop here" — the reader takes the exit you offered.' },
      { question:'What should replace a summarising last sentence?', answer:'The question the next section answers.' }] },
  { type:'takeaway', title:'Tension Is the Transition', body:'You do not need better sentences. You need worse endings.',
    points:['Cut every closing summary','Leave one loop open per beat'] }
];

const ANSWER =
  'Short answer: the ending of each section, not the beginning, is what decides whether people keep reading.\n\n' +
  F(ALL[0]) + '\n' + F(ALL[2]) + '\n' + F(ALL[4]) + '\n' + F(ALL[7]) + '\n' + F(ALL[8]);

const BROKEN =
  'Three things go wrong in practice.\n\n' +
  '```studyblock\n{"type":"card", "title": unquoted, oops}\n```\n' +
  F({ type:'hologram', title:'A type that does not exist' }) +
  F({ type:'card', title:'<img src=x onerror=alert(1)>', body:'<script>alert(2)<\/script> injected into a body field',
      howToUse:['"><b>markup in a list item</b>'], usefulFor:'proving fields are escaped' });

function paint(which){
  const text = which === 'all' ? ALL.map(F).join('\n')
             : which === 'answer' ? ANSWER
             : BROKEN;
  StudyBlocks.render(document.getElementById('out'), text);
}
paint('all');
</script>
</body>
</html>
