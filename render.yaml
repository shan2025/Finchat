# Render blueprint for the FinChat backend (service "Finchat-6").
#
# NOTE: this file does NOT retroactively take over a service that was created
# through the Render dashboard. The existing Finchat-6 service keeps using its
# dashboard settings until you either point a Blueprint at this repo
# (Render -> New -> Blueprint) or recreate the service from it. Until then treat
# this as documentation of the intended configuration — and if you change the
# service in the dashboard, change it here too.
#
# Secrets are declared with `sync: false`, meaning Render prompts for them
# rather than reading them from source control. Nothing secret belongs in here:
# `.env` is listed in both .gitignore and .dockerignore, so the image ships with
# no credentials and every value below must exist in the service Environment.

services:
  - type: web
    name: Finchat-6
    runtime: docker
    plan: free
    branch: main

    # The Dockerfile lives under backend/ but COPYs both `backend/` and
    # `frontend/`, so the build context has to be the directory above it.
    dockerfilePath: ./legacy_prototype/backend/Dockerfile
    dockerContext: ./legacy_prototype

    # Safe now that /health degrades to 503 instead of throwing. Previously an
    # unhandled rejection in this handler killed the process, so probing it
    # turned a database outage into a permanent restart loop.
    healthCheckPath: /health

    envVars:
      # PORT is injected by Render; server.js already honours it.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d

      # Supabase session pooler. Must be URL-encoded — the password contains
      # characters that are otherwise parsed as URL delimiters. Re-check this
      # whenever the Supabase project changes: a stale value here fails with
      # "(ENOTFOUND) tenant/user <ref> not found", which is a dead tenant
      # rather than a DNS problem.
      - key: DATABASE_URL
        sync: false

      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      - key: GROQ_API_KEY
        sync: false

      # Groq's free allowance is per-model per-day, so an exhausted primary is
      # recovered by switching model, not by waiting. Listed in try-order and
      # spanning three families so one spent quota cannot stall inference.
      # This matters more here than locally: the Ollama fallback in
      # services/inference.js points at localhost, which does not exist on
      # Render, so without these a spent Groq quota means no inference at all.
      - key: GROQ_FALLBACK_MODELS
        value: openai/gpt-oss-120b,llama-3.1-8b-instant

      - key: PINATA_API_KEY
        sync: false
      - key: PINATA_SECRET_KEY
        sync: false

      # JSON array of the 64 secret-key bytes. Without it the devnet wallet is
      # regenerated on every boot, because the container filesystem is
      # ephemeral and .solana-keypair.json does not survive a restart.
      - key: SOLANA_SECRET_KEY
        sync: false

      - key: FRONTEND_URL
        value: https://finchat-6.onrender.com

      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      # Web Push signing pair. Optional, but without it the keys are generated
      # at boot and lost with the container, which silently invalidates every
      # browser subscription made against the previous pair. Generate once with
      # `npx web-push generate-vapid-keys` and keep them stable.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

      # Shared secret for the external scheduler that drives /api/cron/*.
      # Required for missions and briefings to fire on the free plan, where the
      # instance sleeps when idle and the in-process scheduler stops with it.
      # If unset, the cron routes refuse every request (they fail closed).
      - key: CRON_SECRET
        generateValue: true
